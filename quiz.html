<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="css/quiz.css">
</head>
<body>
    <main class="quiBody">
        <section class="quiz-container" id="quiz" data-question-index="0" data-correct-answer="0">
            <header class="quiz-header">
                <h1 class="quiz-title">Web Development Quiz</h1>

                <div class="quiz-progress">
                    <span id="question-count"></span>
                    <span id="quiz-score">Score: 0</span>
                </div>

                <div class="progress-track" aria-hidden="true">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
            </header>

            <div class="quiz-content" aria-live="polite">
                
            </div>

            <nav class="quiz-navigation" aria-label="Quiz navigation">
                <button class="quiz-button previous" id="previous-button" type="button" disabled>
                    Previous
                </button>
                <button class="quiz-button next" id="next-button" type="button">
                    Next
                </button>
            </nav>
        </section>
    </main>

    <script src="js/quiz.js"></script>
</body>
</html>
